<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<title>Home</title>
</head>

<body>

<h2>Dashboard</h2>

<p>Balance: S/ <span id="bal"></span></p>
<p>VIP: <span id="vip"></span></p>

<button onclick="goVIP()">VIP</button>

<script>

let user = JSON.parse(localStorage.getItem("currentUser"));

document.getElementById("bal").innerText = user.balance;
document.getElementById("vip").innerText = user.vip;

function goVIP(){
window.location.href="vip.html";
}

</script>

</body>
</html>
