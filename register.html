<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>Registro</title>

<style>
body{
font-family:Arial;
background:#f5f5f5;
padding:20px;
}

.box{
max-width:400px;
margin:auto;
background:white;
padding:20px;
border-radius:15px;
box-shadow:0 0 10px rgba(0,0,0,0.1);
}

input{
width:100%;
padding:12px;
margin-top:12px;
border:none;
border-radius:10px;
background:#eee;
}

button{
width:100%;
padding:12px;
margin-top:15px;
border:none;
border-radius:10px;
background:#28a745;
color:white;
font-weight:bold;
}

a{
display:block;
margin-top:15px;
text-align:center;
}
</style>
</head>

<body>

<div class="box">

<h2>Registro de usuario</h2>

<input type="text" id="username" placeholder="Nombre de usuario">

<input type="text" id="phone" placeholder="Número de teléfono">

<input type="password" id="password" placeholder="Contraseña">

<input type="password" id="confirm" placeholder="Confirmar contraseña">

<button onclick="register()">
REGISTRARSE
</button>

<a href="index.html">
INICIAR SESIÓN
</a>

</div>

<script>

function register(){

let username =
document.getElementById("username").value;

let phone =
document.getElementById("phone").value;

let password =
document.getElementById("password").value;

let confirm =
document.getElementById("confirm").value;

if(password !== confirm){
alert("Passwords do not match");
return;
}

localStorage.setItem("username", username);
localStorage.setItem("phone", phone);
localStorage.setItem("password", password);

alert("Registro exitoso");

window.location.href = "index.html";
}

</script>

</body>
</html>
