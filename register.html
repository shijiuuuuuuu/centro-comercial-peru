<!DOCTYPE html>
<html>
<head>
<title>Registro</title>

<style>

body{
font-family:Arial;
background:#f5f5f5;
padding:20px;
}

.box{
max-width:400px;
margin:auto;
background:white;
padding:20px;
border-radius:15px;
}

input{
width:100%;
padding:12px;
margin-top:10px;
border:none;
border-radius:10px;
background:#eee;
}

button{
width:100%;
padding:12px;
margin-top:15px;
background:#28a745;
color:white;
border:none;
border-radius:10px;
}

</style>
</head>

<body>

<div class="box">

<h2>Registro</h2>

<input type="text" id="username" placeholder="Nombre de usuario">

<input type="text" id="phone" placeholder="N煤mero de tel茅fono">

<input type="password" id="password" placeholder="Contrase帽a">

<input type="password" id="confirm" placeholder="Confirmar contrase帽a">

<button onclick="register()">
REGISTRARSE
</button>

</div>

<script>

function register(){

let username =
document.getElementById("username").value;

let phone =
document.getElementById("phone").value;

let password =
document.getElementById("password").value;

let confirm =
document.getElementById("confirm").value;

if(password != confirm){

alert("Passwords do not match");
return;

}

localStorage.setItem("username", username);
localStorage.setItem("phone", phone);
localStorage.setItem("password", password);

alert("Registro exitoso");

window.location.href = "index.html";

}

</script>

</body>
</html>
