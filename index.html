<!DOCTYPE html>
<html>
<head>
  <title>Centro Comercial Perú</title>
  <style>
    body{
      background:#111;
      color:white;
      font-family:Arial;
      text-align:center;
      padding-top:100px;
    }

    .card{
      background:#1e1e1e;
      width:350px;
      margin:auto;
      padding:30px;
      border-radius:20px;
      box-shadow:0 0 20px rgba(255,215,0,0.3);
    }

    input{
      width:90%;
      padding:12px;
      margin-top:15px;
      border-radius:10px;
      border:none;
    }

    button{
      width:95%;
      padding:12px;
      margin-top:20px;
      border:none;
      border-radius:10px;
      background:gold;
      font-weight:bold;
      cursor:pointer;
    }

    h1{
      color:gold;
    }
  </style>
</head>

<body>

<div class="card">
  <h1>Centro Comercial Perú</h1>

  <p>Iniciar Sesión</p>

  <input type="text" placeholder="Número Peruano">

  <input type="password" placeholder="Contraseña">

  <button onclick="window.location.href='vip.html'">
Ingresar
</button>
</div>

</body>
</html>
