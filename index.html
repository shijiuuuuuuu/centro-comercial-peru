<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>Centro Comercial Perú</title>

<style>

body{
background:#000;
font-family:Arial;
display:flex;
justify-content:center;
align-items:center;
height:100vh;
margin:0;
}

.card{
background:#1e1e1e;
padding:40px;
border-radius:20px;
width:320px;
text-align:center;
box-shadow:0 0 30px rgba(255,215,0,0.3);
}

h1{
color:gold;
}

p{
color:white;
}

input{
width:100%;
padding:15px;
margin-top:15px;
border:none;
border-radius:10px;
background:#eee;
}

button{
width:100%;
padding:15px;
margin-top:20px;
background:gold;
border:none;
border-radius:10px;
font-weight:bold;
cursor:pointer;
}

a{
display:block;
margin-top:15px;
color:white;
text-decoration:none;
}

</style>
</head>

<body>

<div class="card">

<h1>Centro Comercial Perú</h1>

<p>Iniciar Sesión</p>

<input type="text"
id="user"
placeholder="Usuario o teléfono">

<input type="password"
id="pass"
placeholder="Contraseña">

<button onclick="login()">
Ingresar
</button>

<a href="register.html">
Crear cuenta
</a>

</div>

<script>

function login(){

let user =
document.getElementById("user").value;

let pass =
document.getElementById("pass").value;

let savedUser =
localStorage.getItem("username");

let savedPhone =
localStorage.getItem("phone");

let savedPass =
localStorage.getItem("password");

if(
(user === savedUser || user === savedPhone)
&&
pass === savedPass
){

window.location.href = "vip.html";

}else{

alert("Datos incorrectos");

}

}

</script>

</body>
</html>
