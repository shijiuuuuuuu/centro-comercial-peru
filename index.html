<!DOCTYPE html>
<html>
<head>
  <title>Centro Comercial Perú</title>
  <style>
    body{
      background:#111;
      color:white;
      font-family:Arial;
      text-align:center;
      padding-top:100px;
    }

    .card{
      background:#1e1e1e;
      width:350px;
      margin:auto;
      padding:30px;
      border-radius:20px;
      box-shadow:0 0 20px rgba(255,215,0,0.3);
    }

    input{
      width:90%;
      padding:12px;
      margin-top:15px;
      border-radius:10px;
      border:none;
    }

    button{
      width:95%;
      padding:12px;
      margin-top:20px;
      border:none;
      border-radius:10px;
      background:gold;
      font-weight:bold;
      cursor:pointer;
    }

    h1{
      color:gold;
    }
  </style>
</head>

<body>

<div class="card">
  <h1>Centro Comercial Perú</h1>

  <p>Iniciar Sesión</p>

  <input type="text" id="user" placeholder="Usuario o teléfono">

<input type="password" id="pass" placeholder="Contraseña">

<button onclick="login()">
Ingresar
</button>
</div>
<script>

function login(){

let user =
document.getElementById("user").value;

let pass =
document.getElementById("pass").value;

let savedUser =
localStorage.getItem("username");

let savedPhone =
localStorage.getItem("phone");

let savedPass =
localStorage.getItem("password");

if(
(user === savedUser || user === savedPhone)
&&
pass === savedPass
){

window.location.href = "vip.html";

}else{

alert("Datos incorrectos");

}

}

</script>

</script>
</body>
</html>
