</script><script>

// USER DATA
document.getElementById("showUser").innerText =
localStorage.getItem("username");

document.getElementById("showPhone").innerText =
localStorage.getItem("phone");

// WALLET
function getBalance(){
return parseFloat(localStorage.getItem("balance") || "10");
}

function setBalance(v){
localStorage.setItem("balance", v);
document.getElementById("balance").innerText = v.toFixed(2);
}

setBalance(getBalance());

// ADD MONEY (VIP sync)
function addMoney(amount){
let b = getBalance();
b += amount;
setBalance(b);
}

// AVATAR UPLOAD SIMULATION
document.getElementById("avatarInput").addEventListener("change", function(e){
let file = e.target.files[0];
let reader = new FileReader();

reader.onload = function(){
document.getElementById("avatarPreview").src = reader.result;
localStorage.setItem("avatar", reader.result);
};

reader.readAsDataURL(file);
});

// LOAD AVATAR
if(localStorage.getItem("avatar")){
document.getElementById("avatarPreview").src =
localStorage.getItem("avatar");
}

</script>
