<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<title>Mi Cuenta</title>
</head>

<body>

<h2>Mi Cuenta</h2>

<p>Balance: S/ <span id="bal"></span></p>

<h3>Banco</h3>

<input id="bank" placeholder="Banco">
<button onclick="connect()">Conectar</button>

<button onclick="withdraw()">Retirar</button>

<script>

let user = JSON.parse(localStorage.getItem("currentUser"));
document.getElementById("bal").innerText = user.balance;

function connect(){
localStorage.setItem("bank","ok");
alert("Banco conectado");
}

function withdraw(){

if(!localStorage.getItem("bank")){
alert("Conecta banco primero");
return;
}

if(localStorage.getItem("orders") < 12){
alert("Completa órdenes");
return;
}

alert("Retiro exitoso");
}

</script>

</body>
</html>
