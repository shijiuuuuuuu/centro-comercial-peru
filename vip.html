.vip{

}.slider{
overflow:hidden;

}

.slide-track{
display:flex;
width:2500px;
animation:scroll 20s linear infinite;
}

.slide-track img{
width:220px;
height:160px;
object-fit:cover;
margin:10px;
border-radius:20px;
box-shadow:0 0 15px rgba(255,255,255,0.2);
}

@keyframes scroll{

0%{
transform:translateX(0);
}

100%{
transform:translateX(-1200px);
}

}
</style>
