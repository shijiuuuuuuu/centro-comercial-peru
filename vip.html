<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<title>VIP</title>
</head>

<body>

<h2>VIP Orders</h2>

<p id="count">0/12</p>

<button onclick="doOrder()">Order</button>

<script>

let count = localStorage.getItem("orders") || 0;

function update(){
document.getElementById("count").innerText = count + "/12";
}

function doOrder(){

if(count >= 12){
alert("VIP completed");
return;
}

count++;
localStorage.setItem("orders",count);

update();
}

update();

</script>

</body>
</html>
